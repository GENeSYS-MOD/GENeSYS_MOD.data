name: CSV Sort Check

on:
  pull_request:
    paths:
      - "Data/Parameters/**/*.csv"
      - ".github/sort_csvs.py"
  push:
    branches: [main]
    paths:
      - "Data/Parameters/**/*.csv"
      - ".github/sort_csvs.py"

permissions:
  contents: read

jobs:
  csv-sort:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that parameter CSVs are sorted
        run: |
          python .github/sort_csvs.py --check | tee sort_report.txt
          status=${PIPESTATUS[0]}
          {
            echo "### CSV Sort Check"
            echo '```'
            cat sort_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
