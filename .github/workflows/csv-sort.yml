name: CSV Sort

# Keeps the parameter CSVs sorted by column order (see .github/sort_csvs.py).
# Pull requests from branches of this repository: the files are sorted and the
# result is committed back onto the PR branch, so it shows up in the PR.
# Pull requests from forks and pushes to main: the check fails if a file is
# not sorted (a fork branch cannot be pushed to with the workflow token).

on:
  pull_request:
    paths:
      - "Data/Parameters/**/*.csv"
      - ".github/sort_csvs.py"
  push:
    branches: [main]
    paths:
      - "Data/Parameters/**/*.csv"
      - ".github/sort_csvs.py"

permissions:
  contents: write

concurrency:
  group: csv-sort-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  csv-sort:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sort and commit to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python .github/sort_csvs.py
          if git diff --quiet -- Data/Parameters; then
            echo "All parameter CSVs are sorted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Parameters
          git commit -m "style: sort parameter CSVs by column order (automatic)"
          git push
          echo "Sorted CSVs were committed to ${{ github.event.pull_request.head.ref }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Check sorting (forks and main)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          python .github/sort_csvs.py --check | tee sort_report.txt
          status=${PIPESTATUS[0]}
          { echo "### CSV Sort Check"; echo '```'; cat sort_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
